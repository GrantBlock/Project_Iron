<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Chat — Connection</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f2328; background: #f2f3f4; }
  header { background: #12152a; color: #fff; padding: 18px 20px; font-size: 18px; }
  header small { display: block; font-size: 12.5px; opacity: .75; margin-top: 2px; }
  main { padding: 16px 20px; }
  .msg { background: #fdecea; color: #8a1c1c; border-radius: 4px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; display: none; }
  .opt { background: #fff; border: 1px solid #e3e5e8; border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  .opt.sel { border-color: #12152a; box-shadow: inset 3px 0 0 #12152a; }
  .opt b { display: block; font-size: 14.5px; }
  .opt span { font-size: 12.5px; color: #6b7280; }
  input[type=text] { width: 100%; border: 1px solid #cfd3d8; border-radius: 4px; padding: 9px 10px; font: inherit; font-size: 14px; margin-top: 8px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button { flex: 1; border: 0; border-radius: 4px; padding: 10px; font-size: 14px; cursor: pointer; }
  .primary { background: #12152a; color: #fff; } .secondary { background: #eef1f5; color: #12152a; }
  button:disabled { opacity: .6; cursor: default; }
  .status { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .ok { color: #1f8a4c; } .bad { color: #c62828; }
</style>
</head>
<body>
<header>Project Chat<small>Choose how this computer uses Project Chat</small></header>
<main>
  <div class="msg" id="msg"></div>
  <label class="opt" id="optServer"><input type="radio" name="mode" value="server"><div><b>Run the server on this computer</b><span>This PC keeps the chat and receives reports. Other computers connect to it.</span></div></label>
  <label class="opt" id="optClient"><input type="radio" name="mode" value="client"><div><b>Connect to another computer</b><span>Open the chat running on your main PC. Nothing is stored here.</span>
    <input type="text" id="url" placeholder="e.g. 100.91.95.74:3500"></div></label>
  <div class="row">
    <button class="secondary" id="test">Test connection</button>
    <button class="primary" id="save">Save and restart</button>
  </div>
  <div class="status" id="status"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const msg = new URLSearchParams(location.search).get('msg');
if (msg) { $('#msg').textContent = msg; $('#msg').style.display = 'block'; }
function mode() { return (document.querySelector('input[name=mode]:checked') || {}).value; }
function paint() {
  $('#optServer').classList.toggle('sel', mode() === 'server');
  $('#optClient').classList.toggle('sel', mode() === 'client');
  $('#test').disabled = mode() !== 'client';
}
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = paint);
$('#url').onfocus = () => { document.querySelector('input[value=client]').checked = true; paint(); };
function status(t, cls) { $('#status').textContent = t; $('#status').className = 'status ' + (cls || ''); }
(async () => {
  const d = await window.pc.get();
  document.querySelector(`input[value=${d.mode === 'client' ? 'client' : 'server'}]`).checked = true;
  $('#url').value = (d.serverUrl || '').replace(/^http:\/\//, '');
  paint();
})();
$('#test').onclick = async () => {
  status('Testing…');
  const r = await window.pc.test($('#url').value);
  r.ok ? status('Connected. The server is reachable.', 'ok') : status(r.error, 'bad');
};
$('#save').onclick = async () => {
  if (!mode()) return status('Choose an option.', 'bad');
  if (mode() === 'client' && !$('#url').value.trim()) return status('Enter the server address.', 'bad');
  $('#save').disabled = true; status('Saving…');
  const r = await window.pc.save(mode(), $('#url').value);
  if (r && !r.ok) { status(r.error, 'bad'); $('#save').disabled = false; }
};
</script>
</body>
</html>
