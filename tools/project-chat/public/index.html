<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Chat</title>
<link rel="icon" href="/favicon.png">
<style>
  :root {
    --navy: #0b2a5b; --navy-2: #12397a; --blue: #1a6fd1; --line: #e3e5e8;
    --text: #1f2328; --muted: #6b7280; --bubble-me: var(--blue); --bg: #eef1f5;
    --ink: #12152a; --blush: #f2f3f4; /* grayish white: banner, chat and panel backgrounds */
    --pass: #1f8a4c; --fail: #c62828; --warn: #b26a00; --info: #4682b4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; }

  .widget { width: 440px; max-width: 100%; height: min(820px, calc(100vh - 32px)); background: #fff; border-radius: 6px;
            box-shadow: 0 10px 40px rgba(10,30,60,.18); background: var(--blush); display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .widget.min { height: auto; } .widget.min > :not(header) { display: none; }
  
  /* Desktop app window: fill the window */
  body.app { padding: 0; background: var(--blush); }
  body.app .widget { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
  body.app #minBtn, body.app #closeBtn { display: none; }

  /* Header */
  header { background: url("/banner.png") center bottom / 100% auto no-repeat, linear-gradient(var(--ink), var(--ink)) top / 100% 30px no-repeat; color: #fff; flex-shrink: 0;
           padding: 0 14px 11.111%; /* 1/9 of width = banner's 1080x120 proportions */ }
  /* Header floats over the chat; messages scroll up underneath and show through the banner's gaps */
  .widget { position: relative; }
  header { position: absolute; top: 0; left: 0; right: 0; z-index: 3; }
  .widget.min header { position: relative; }
  header .bar { height: 26px; padding-top: 4px; display: flex; align-items: center; gap: 8px; }
  header .bar .spacer { flex: 1; }
  /* Title centered over the whole header, overlapping the banner */
  .title { position: absolute; left: 70px; right: 70px; top: 9px; /* text top level with the Menu text; header size unchanged */ text-align: center; line-height: 1.15;
           pointer-events: none; text-shadow: 0 1px 3px rgba(18,21,42,.85), 0 0 8px rgba(18,21,42,.6); }
  .pill { background: rgba(255,255,255,.16); border: 0; color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 12px; cursor: pointer; }
  .pill:hover { background: rgba(255,255,255,.28); }
  .title .t1 { font-size: 17px; }
  .title .t2 { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { background: none; border: 0; color: #fff; cursor: pointer; padding: 4px; display: grid; place-items: center; }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Messages */
  #log { flex: 1; overflow-y: auto; padding: calc(var(--header-h, 77px) + 4px) 12px 8px; scroll-padding-top: var(--header-h, 77px); background: var(--blush); display: flex; flex-direction: column; }
  #log > :first-child { margin-top: auto; } /* messages sit at the bottom; new ones push older ones up */
  .avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #fff; flex-shrink: 0;
            display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--navy); }
  /* Messages: name + avatar above a group, rounded borderless bubbles, time below the group */
  .row { display: flex; flex-direction: column; align-items: flex-start; margin: 14px 0 0; }
  .row.cont { margin-top: 6px; }
  .row.me { align-items: flex-end; }
  .who { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .row.me .who { flex-direction: row-reverse; }
  .row.cont .who { display: none; }
  .mavatar { width: 28px; height: 28px; border-radius: 50%; background: #fff; color: var(--navy); display: grid; place-items: center;
             font-size: 11.5px; font-weight: 700; box-shadow: 0 0 0 1px #dfe2e6; flex-shrink: 0; }
  .mavatar.report { background: var(--navy-2); color: #fff; box-shadow: none; }
  .mavatar img, .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .mavatar.pic, .avatar.pic { background: #fff; padding: 0; overflow: hidden; }
  .pic-row { display: flex; align-items: center; gap: 10px; margin: 2px 0 6px; font-size: 13px; }
  .pic-row .avatar { width: 44px; height: 44px; }
  .linkbtn { background: none; border: 0; color: var(--blue); cursor: pointer; padding: 0; font-size: 13px; }
  .row.me .mavatar { background: var(--blue); color: #fff; box-shadow: none; }
  .bubble { background: #fff; border-radius: 12px; padding: 10px 14px; font-size: 14.5px; line-height: 1.45; max-width: 78%;
            margin-left: 36px; box-shadow: 0 1px 1px rgba(18,21,42,.05); word-wrap: break-word; overflow-wrap: anywhere; }
  .row.me .bubble { margin-left: 0; margin-right: 36px; background: var(--bubble-me); color: #fff; }
  .row.me .bubble code { background: rgba(255,255,255,.18); color: #fff; }
  .row.me .bubble a { color: #fff; }
  .bubble p { margin: 4px 0; } .bubble ul { margin: 4px 0; padding-left: 18px; }
  .bubble code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 12.5px; }
  .bubble pre { background: #f3f4f6; padding: 8px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
  .bubble h4 { margin: 8px 0 4px; font-size: 14px; }
  .time { font-size: 11px; color: #9aa0a8; margin: 5px 36px 0; }
  .row.grouped .time { display: none; }
  .report-kicker { font-size: 12px; color: var(--muted); }
  .day { text-align: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a2a8b0; margin: 14px 0 0; }

  /* Report card */
  .report-head { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #fff; padding: 2px 8px; border-radius: 10px; background: var(--info); }
  .chip.pass, .chip.passed, .chip.success { background: var(--pass); }
  .chip.fail, .chip.failed, .chip.error { background: var(--fail); }
  .chip.partial, .chip.warn, .chip.warning { background: var(--warn); }
  .report-title { font-weight: 600; }
  .stats { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); margin: 4px 0; flex-wrap: wrap; }
  .toggle { background: none; border: 0; color: var(--blue); padding: 0; cursor: pointer; font-size: 13px; margin-top: 6px; }
  .full { display: none; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; }
  .full.open { display: block; }
  .typing { font-size: 13px; color: var(--muted); padding: 0 14px 6px; height: 20px; background: var(--blush); }

  /* Composer */
  .composer { background: var(--blush); border-top: 1px solid var(--line); display: flex; align-items: flex-end; gap: 10px; padding: 12px 12px 14px 14px; flex-shrink: 0; }
  textarea { flex: 1; border: 0; background: transparent; outline: none; resize: none; font: inherit; font-size: 16px; color: var(--text); max-height: 120px; padding: 8px 0; }
  textarea::placeholder { color: #7a7f87; }
  .send { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--blue); cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
  .send:disabled { opacity: .5; cursor: default; }
  .send svg { width: 24px; height: 24px; }

  /* Menu panel */
  .panel { position: absolute; top: 0; padding-top: var(--header-h, 77px); /* starts under the banner so its gaps show the panel, not the chat */ left: 0; right: 0; bottom: 0; background: var(--blush); transform: translateX(-100%); transition: transform .2s ease; display: flex; flex-direction: column; z-index: 2; } /* below the header (z 3) */
  .panel.open { transform: translateX(0); }
  .panel .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .panel .tabs button { flex: 1; background: none; border: 0; padding: 12px; font-size: 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .panel .tabs button.active { color: var(--navy); border-color: var(--navy); font-weight: 600; }
  .panel .body { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .team { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 6px; }
  .proj { background: #fff; display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
  .proj:hover { background: #f7f8fa; }
  .proj.current { border-color: var(--navy); box-shadow: inset 3px 0 0 var(--navy); }
  .proj .meta { flex: 1; min-width: 0; }
  .proj .n { font-weight: 600; font-size: 14px; }
  .proj .a { font-size: 12.5px; color: var(--muted); }
  .badge { background: var(--fail); color: #fff; font-size: 11px; border-radius: 10px; padding: 1px 7px; }
  form.add { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; display: grid; gap: 8px; }
  form.add input { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font: inherit; font-size: 14px; }
  form.add button, .btn { background: var(--navy); color: #fff; border: 0; border-radius: 4px; padding: 9px; font-size: 14px; cursor: pointer; }
  .rep-item { padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .rep-item .d { font-size: 12px; color: var(--muted); }
  .kv { font-size: 13px; margin: 6px 0; }
  .kv code { background: #f3f4f6; padding: 2px 5px; border-radius: 3px; word-break: break-all; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; margin-top: 40px; }
  .flash { animation: flash 1.4s ease; } @keyframes flash { 0% { background: #fff6d6; } 100% { background: #fff; } }
</style>
</head>
<body>
<div class="widget" id="widget">
  <header><div class="bar">
    <button class="pill" id="menuBtn">Menu</button>
    <div class="title"><div class="t1">Agent Chat</div><div class="t2" id="sub">Loading…</div></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="minBtn" title="Minimize"><svg viewBox="0 0 24 24"><path d="M5 18h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></button>
    <button class="icon-btn" id="closeBtn" title="Close menu / clear view"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></button>
  </div></header>

  <div id="log"></div>
  <div class="typing" id="typing"></div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Type reply"></textarea>
    <button class="send" id="sendBtn" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M21 3L3 10.5l7 2.5 2.5 7L21 3z"/><path d="M10 13l11-10"/></svg></button>
  </div>

  <div class="panel" id="panel">
    <div class="tabs">
      <button data-tab="projects" class="active">Projects</button>
      <button data-tab="reports">Reports</button>
      <button data-tab="connect">Connect</button>
    </div>
    <div class="body" id="panelBody"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
if (new URLSearchParams(location.search).has('app')) document.body.classList.add('app');
const state = { projects: [], current: null, messages: [], unread: {}, info: null, tab: 'projects' };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function md(src) {
  const blocks = [];
  let s = esc(src).replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, c) => { blocks.push('<pre>' + c + '</pre>'); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const out = []; let list = false;
  for (const line of s.split('\n')) {
    const li = line.match(/^\s*[-*]\s+(.*)/), h = line.match(/^#{1,6}\s+(.*)/);
    if (li) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + li[1] + '</li>'); continue; }
    if (list) { out.push('</ul>'); list = false; }
    if (h) out.push('<h4>' + h[1] + '</h4>'); else if (line.trim()) out.push('<p>' + line + '</p>');
  }
  if (list) out.push('</ul>');
  return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}
const initials = n => String(n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtDay = ts => new Date(ts).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });

// The project's agent picture (stored on the server PC), or initials
function agentPic(projectId, author) {
  const pr = state.projects.find(p => p.id === projectId);
  return pr && pr.avatar && String(author).toLowerCase() === String(pr.agent).toLowerCase() ? pr.avatar : '';
}
function avatarInner(pic, name) { return pic ? `<img src="${esc(pic)}" alt="">` : esc(initials(name)); }
function sameGroup(a, b) {
  return a && b && a.author === b.author && (a.role === 'user') === (b.role === 'user') &&
    fmtDay(a.ts) === fmtDay(b.ts) && (new Date(b.ts) - new Date(a.ts)) < 5 * 60 * 1000;
}
function renderMessage(m, cont) {
  const me = m.role === 'user';
  const row = document.createElement('div');
  row.className = 'row' + (me ? ' me' : '') + (cont ? ' cont' : '');
  row.id = 'm-' + m.id;
  let inner;
  if (m.role === 'report') {
    const r = m.report, st = r.stats || {};
    const stats = Object.keys(st).length ? `<div class="stats">${Object.entries(st).map(([k, v]) => `<span><b>${esc(v)}</b> ${esc(k)}</span>`).join('')}</div>` : '';
    inner = `<div class="report-kicker">Nightly report · ${esc(r.runDate)}</div>
      <div class="report-head"><span class="chip ${esc(r.status)}">${esc(r.status)}</span><span class="report-title">${esc(r.title)}</span></div>
      ${stats}${r.summary ? md(r.summary) : ''}
      ${r.body || r.link ? `<button class="toggle">View full report</button><div class="full">${md(r.body)}${r.link ? `<p><a href="${esc(r.link)}" target="_blank" rel="noopener">${/github\.com/.test(r.link) ? 'Open on GitHub' : 'Open link'}</a></p>` : ''}</div>` : ''}`;
  } else {
    inner = md(m.text);
  }
  const pic = me ? '' : agentPic(m.projectId, m.author);
  row.innerHTML = `<div class="who"><div class="mavatar ${pic ? 'pic' : m.role === 'report' ? 'report' : ''}">${avatarInner(pic, m.author)}</div><span>${esc(m.author)}</span></div>
    <div class="bubble">${inner}</div><div class="time">${fmtTime(m.ts)}</div>`;
  const t = row.querySelector('.toggle');
  if (t) t.onclick = () => { const f = row.querySelector('.full'); f.classList.toggle('open'); t.textContent = f.classList.contains('open') ? 'Hide full report' : 'View full report'; };
  return row;
}

function renderLog() {
  const log = $('#log'); log.innerHTML = '';
  if (!state.messages.length) { log.innerHTML = '<div class="empty">No messages yet.</div>'; return; }
  let prev = null;
  for (const m of state.messages) {
    if (!prev || fmtDay(prev.ts) !== fmtDay(m.ts)) log.insertAdjacentHTML('beforeend', `<div class="day">${dayLabel(m.ts)}</div>`);
    const cont = sameGroup(prev, m);
    if (cont) document.getElementById('m-' + prev.id).classList.add('grouped');
    log.appendChild(renderMessage(m, cont));
    prev = m;
  }
  log.scrollTop = log.scrollHeight;
}
function appendMessage(m) {
  const log = $('#log');
  if (log.querySelector('.empty')) log.innerHTML = '';
  const prev = state.messages[state.messages.length - 2];
  if (!prev || fmtDay(prev.ts) !== fmtDay(m.ts)) log.insertAdjacentHTML('beforeend', `<div class="day">${dayLabel(m.ts)}</div>`);
  const cont = sameGroup(prev, m);
  if (cont) { const el = document.getElementById('m-' + prev.id); if (el) el.classList.add('grouped'); }
  log.appendChild(renderMessage(m, cont));
  log.scrollTop = log.scrollHeight;
}
function dayLabel(ts) {
  const d = new Date(ts), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return fmtDay(ts);
}

// Keep the menu panel below the full header so the banner always shows
function syncHeader() { document.documentElement.style.setProperty('--header-h', document.querySelector('header').offsetHeight + 'px'); }
addEventListener('resize', syncHeader);
function project() { return state.projects.find(p => p.id === state.current); }
function setHeader() {
  const p = project();
  $('#sub').textContent = p ? `${p.agent} · ${p.name}` : 'No project selected';
  const total = Object.values(state.unread).reduce((a, b) => a + b, 0);
  $('#menuBtn').textContent = total ? `Menu (${total})` : 'Menu';
}

async function loadProjects() {
  state.projects = await api('/api/projects');
  if (!state.projects.find(p => p.id === state.current)) state.current = store.get('project') && state.projects.find(p => p.id === store.get('project')) ? store.get('project') : (state.projects[0] || {}).id;
}
async function selectProject(id) {
  state.current = id; store.set('project', id); state.unread[id] = 0;
  state.messages = await api(`/api/projects/${encodeURIComponent(id)}/messages`);
  setHeader(); renderLog(); closePanel();
}

// ---- Menu panel ----
function openPanel(tab) { if (tab) state.tab = tab; renderPanel(); $('#panel').classList.add('open'); }
function closePanel() { $('#panel').classList.remove('open'); }
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; renderPanel(); });

function renderPanel() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  const body = $('#panelBody');
  if (state.tab === 'projects') {
    const teams = {};
    for (const p of state.projects) (teams[p.team] ||= []).push(p);
    body.innerHTML = Object.entries(teams).map(([team, list]) => `<div class="team">${esc(team)}</div>` + list.map(p => `
      <div class="proj ${p.id === state.current ? 'current' : ''}" data-id="${esc(p.id)}">
        <div class="avatar ${p.avatar ? 'pic' : ''}">${avatarInner(p.avatar, p.agent)}</div>
        <div class="meta"><div class="n">${esc(p.name)}</div><div class="a">${esc(p.agent)}${p.description ? ' · ' + esc(p.description) : ''}</div></div>
        ${state.unread[p.id] ? `<span class="badge">${state.unread[p.id]}</span>` : ''}
      </div>`).join('')).join('') + `
      ${project() ? `<div class="team">${esc(project().agent)}'s picture</div>
      <div class="pic-row"><div class="avatar ${project().avatar ? 'pic' : ''}">${avatarInner(project().avatar, project().agent)}</div>
        <button type="button" class="linkbtn" id="picBtn">Choose picture</button>
        ${project().avatar ? '<button type="button" class="linkbtn" id="picDel">Remove</button>' : ''}
        <input type="file" id="picFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div>
      <div class="muted">Saved only on the server PC, not in the repository.</div>` : ''}
      <form class="add" id="addForm">
        <div class="muted">Add a project</div>
        <input name="team" placeholder="Team (e.g. designengineering.ai Development Team)" required>
        <input name="name" placeholder="Project name" required>
        <input name="agent" placeholder="Agent name" required>
        <input name="description" placeholder="Description (optional)">
        <button>Add project</button>
      </form>`;
    body.querySelectorAll('.proj').forEach(el => el.onclick = () => selectProject(el.dataset.id));
    if ($('#picBtn')) {
      $('#picBtn').onclick = () => $('#picFile').click();
      $('#picFile').onchange = async e => { const f = e.target.files[0]; if (f) await setAgentPicture(f); };
    }
    if ($('#picDel')) $('#picDel').onclick = async () => {
      await api(`/api/projects/${encodeURIComponent(state.current)}/avatar`, { method: 'DELETE' });
      await loadProjects(); renderLog(); renderPanel();
    };
    $('#addForm').onsubmit = async e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const p = await api('/api/projects', { method: 'POST', body: JSON.stringify(f) });
      await loadProjects(); selectProject(p.id);
    };
  } else if (state.tab === 'reports') {
    const reps = state.messages.filter(m => m.role === 'report').reverse();
    body.innerHTML = reps.length ? reps.map(m => `
      <div class="rep-item" data-id="${m.id}"><span class="chip ${esc(m.report.status)}">${esc(m.report.status)}</span> ${esc(m.report.title)}
      <div class="d">${esc(m.report.runDate)} · ${esc(m.author)}</div></div>`).join('') : '<div class="empty">No reports yet for this project.</div>';
    body.querySelectorAll('.rep-item').forEach(el => el.onclick = () => {
      closePanel();
      const row = document.getElementById('m-' + el.dataset.id);
      if (row) { row.scrollIntoView({ block: 'center' }); row.querySelector('.bubble').classList.add('flash'); setTimeout(() => row.querySelector('.bubble').classList.remove('flash'), 1500); }
    });
  } else {
    const i = state.info || { lan: [], port: '' }, p = project();
    body.innerHTML = `
      <div class="team">Open from other computers</div>
      ${i.lan.map(ip => `<div class="kv"><code>http://${ip}:${i.port}</code></div>`).join('') || '<div class="muted">No network address found.</div>'}
      <div class="team">AI replies</div>
      <div class="kv">${i.aiEnabled ? 'On · ' + esc(i.model) : 'Off — add <code>anthropicApiKey</code> to config.json and restart.'}</div>
      <div class="team">Agent report endpoint</div>
      <div class="kv"><code>POST http://${i.lan[0] || 'localhost'}:${i.port}/api/reports</code></div>
      <div class="kv">Header: <code>Authorization: Bearer &lt;reportToken from config.json&gt;</code></div>
      <div class="kv">Project id for this chat: <code>${esc(p ? p.id : '')}</code></div>
      <div class="muted">See scripts/send-report.ps1 for a ready-made sender.</div>
      <div class="team">GitHub report source</div>
      <div class="muted">For cloud agents: the app reads ${esc(p ? p.agent : 'the agent')}'s "Nightly report" comments from this issue.</div>
      <form class="add gh" id="ghForm" style="border-top:0;margin-top:6px;padding-top:0">
        <input name="repo" placeholder="owner/repo, e.g. GrantBlock/Project_Iron">
        <input name="issue" placeholder="Issue number, e.g. 12" inputmode="numeric">
        <div style="display:flex;gap:8px"><button style="flex:1">Save</button><button type="button" id="ghCheck" style="flex:1;background:#e3e7ee;color:var(--navy)">Check now</button></div>
        <div class="muted" id="ghStatus">Loading…</div>
      </form>`;
    loadGithub();
  }
}

function ghStatusText(r) {
  if (!r || !r.github) return 'Not set. Reports only arrive through the report endpoint.';
  const st = r.status || {};
  const when = st.lastCheck ? new Date(st.lastCheck).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'not yet';
  return st.lastError ? `Last check ${when}: ${st.lastError}` : `Watching ${r.github.repo} #${r.github.issue}. Last check ${when}; ${st.imported || 0} imported this session. Checks every ${r.pollMinutes || 5} min.`;
}
async function loadGithub() {
  const p = project(); if (!p) return;
  const f = $('#ghForm'); if (!f) return;
  const url = `/api/projects/${encodeURIComponent(p.id)}/github`;
  const r = await api(url).catch(e => ({ error: e.message }));
  if (r.github) { f.repo.value = r.github.repo; f.issue.value = r.github.issue; }
  $('#ghStatus').textContent = r.error || ghStatusText(r);
  f.onsubmit = async e => {
    e.preventDefault(); $('#ghStatus').textContent = 'Saving and checking…';
    try { const x = await api(url, { method: 'PUT', body: JSON.stringify({ repo: f.repo.value, issue: f.issue.value }) }); $('#ghStatus').textContent = ghStatusText({ ...x, pollMinutes: r.pollMinutes }); }
    catch (err) { $('#ghStatus').textContent = err.message; }
  };
  $('#ghCheck').onclick = async () => {
    $('#ghStatus').textContent = 'Checking…';
    try { await api(url, { method: 'POST' }); const x = await api(url); $('#ghStatus').textContent = ghStatusText(x); }
    catch (err) { $('#ghStatus').textContent = err.message; }
  };
}

// Center-crop the chosen image to a 256 px square before upload
async function setAgentPicture(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight), S = 256;
    const c = document.createElement('canvas'); c.width = c.height = S;
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
    await api(`/api/projects/${encodeURIComponent(state.current)}/avatar`, { method: 'POST', body: JSON.stringify({ dataUrl: c.toDataURL('image/png') }) });
    await loadProjects(); renderLog(); renderPanel();
  } catch (e) { alert('Could not use that picture: ' + (e.message || 'unreadable image')); }
  finally { URL.revokeObjectURL(url); }
}

// ---- Send chat ----
async function send() {
  const input = $('#input'), text = input.value.trim();
  if (!text || !state.current) return;
  input.value = ''; autosize(); $('#sendBtn').disabled = true;
  try { await api(`/api/projects/${encodeURIComponent(state.current)}/chat`, { method: 'POST', body: JSON.stringify({ text }) }); }
  catch (e) { alert('Send failed: ' + e.message); }
  finally { $('#sendBtn').disabled = false; input.focus(); }
}
function autosize() { const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
$('#input').addEventListener('input', autosize);
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('#sendBtn').onclick = send;
$('#menuBtn').onclick = () => $('#panel').classList.contains('open') ? closePanel() : openPanel();
$('#closeBtn').onclick = () => { closePanel(); $('#widget').classList.remove('min'); };
$('#minBtn').onclick = () => $('#widget').classList.toggle('min');

// ---- Live updates ----
let typingTimer;
function connectEvents() {
  const es = new EventSource('/api/events');
  es.onmessage = async e => {
    const evt = JSON.parse(e.data);
    if (evt.type === 'message') {
      const m = evt.message;
      if (m.projectId === state.current) {
        if (!state.messages.some(x => x.id === m.id)) { state.messages.push(m); appendMessage(m); }
        if (m.role === 'assistant') $('#typing').textContent = '';
      } else { state.unread[m.projectId] = (state.unread[m.projectId] || 0) + 1; setHeader(); }
      if (m.role === 'report' && document.hidden && 'Notification' in window && Notification.permission === 'granted')
        new Notification(`${m.author}: ${m.report.status.toUpperCase()}`, { body: m.report.title });
    } else if (evt.type === 'pruned' && evt.projectId === state.current) {
      const gone = new Set(evt.ids);
      state.messages = state.messages.filter(m => !gone.has(m.id));
      renderLog();
    } else if (evt.type === 'typing' && evt.projectId === state.current) {
      $('#typing').textContent = `${evt.author} is typing…`;
      clearTimeout(typingTimer); typingTimer = setTimeout(() => $('#typing').textContent = '', 60000);
    } else if (evt.type === 'projects') { await loadProjects(); renderLog(); if ($('#panel').classList.contains('open')) renderPanel(); }
  };
}

(async () => {
  syncHeader();
  state.info = await api('/api/info').catch(() => null);
  await loadProjects();
  if (state.current) await selectProject(state.current); else { setHeader(); renderLog(); }
  connectEvents();
  if ('Notification' in window && Notification.permission === 'default') document.body.addEventListener('click', () => Notification.requestPermission(), { once: true });
})();
</script>
