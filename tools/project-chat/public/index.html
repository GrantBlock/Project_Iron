<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Chat</title>
<link rel="icon" href="/favicon.png">
<style>
  :root {
    --navy: #0b2a5b; --navy-2: #12397a; --blue: #1a6fd1; --line: #e3e5e8;
    --text: #1f2328; --muted: #5f6670; --bg: #f2f3f4; --ink: #12152a; --card: #ffffff;
    --pass: #1f8a4c; --fail: #c62828; --warn: #b26a00; --info: #4682b4; --sel: #e3ecfa;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); }
  button { font-family: inherit; }
  #app { display: flex; flex-direction: column; height: 100vh; min-height: 560px; position: relative; }

  /* Header: navy bar with the speckle banner beneath; title top-centre, Menu on the right */
  header { position: relative; flex-shrink: 0; height: 92px; padding: 6px 14px 0; color: #fff; image-rendering: pixelated;
           background: url("/banner.png") center bottom / 100% 60px no-repeat, linear-gradient(var(--ink), var(--ink)) top / 100% 34px no-repeat; }
  .title { position: absolute; left: 90px; right: 90px; top: 6px; text-align: center; line-height: 1.15; pointer-events: none; text-shadow: 0 1px 3px rgba(18,21,42,.8); }
  .title .t1 { font-size: 17px; } .title .t2 { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar { display: flex; justify-content: flex-end; }
  .pill { background: rgba(255,255,255,.16); border: 0; color: #fff; font-size: 12px; padding: 4px 12px; border-radius: 12px; cursor: pointer; min-height: 24px; }
  .pill:hover { background: rgba(255,255,255,.28); }

  #main { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; overflow: auto; }

  /* Sidebar */
  #side { flex: 0 1 236px; min-width: 210px; max-height: 100%; overflow: auto; background: var(--card); border-radius: 10px; padding: 12px;
          display: flex; flex-direction: column; gap: 3px; box-shadow: 0 1px 2px rgba(18,21,42,.06); }
  .newchat { display: flex; align-items: center; gap: 8px; background: var(--blue); color: #fff; border: 0; border-radius: 8px; padding: 10px 12px; font-size: 14px; cursor: pointer; min-height: 42px; }
  .sect { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 4px 2px; }
  .grp { font-size: 11px; color: var(--muted); margin: 8px 4px 0; }
  .sess { display: flex; align-items: center; gap: 4px; border-radius: 8px; }
  .sess > button.pick { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; font-size: 13.5px; cursor: pointer; color: var(--text);
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 36px; }
  .sess.on > button.pick { background: var(--sel); color: var(--navy); font-weight: 600; }
  .sess.unread > button.pick::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); margin-left: 6px; vertical-align: 1px; }
  .sess .del { visibility: hidden; background: none; border: 0; color: var(--muted); cursor: pointer; width: 28px; height: 28px; border-radius: 6px; }
  .sess:hover .del, .sess .del:focus { visibility: visible; }
  .sess .del:hover { background: #f1e4e4; color: var(--fail); }
  .sideitem { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; min-height: 40px; color: var(--navy); background: transparent; width: 100%; }
  .sideitem.on { background: var(--sel); }
  .sideitem .sub { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .sect-btn { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: 0; cursor: pointer; padding: 6px 4px; margin-top: 10px;
              font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sect-btn svg { transition: transform .15s; } .sect-btn[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .divider { height: 1px; background: var(--line); margin: 10px 0 4px; }

  /* Work column: Explorer + editor */
  #work { flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 10px; min-height: 440px; max-height: 100%; }
  #work[hidden] { display: none; }
  .win { background: var(--card); border-radius: 10px; box-shadow: 0 1px 2px rgba(18,21,42,.08); display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .win.size-half, .win.size-full { flex: 1 1 0; min-height: 180px; } .win.size-collapsed { flex: 0 0 auto; }
  .win.size-collapsed .wbody { display: none; }
  .whead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .whead .name { font-size: 13px; font-weight: 600; }
  .whead .path { font-size: 12px; color: var(--muted); font-family: Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 40px; min-width: 0; }
  .ibtn { background: #eef1f5; border: 0; border-radius: 6px; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--navy); flex-shrink: 0; }
  .tbtn { background: #eef1f5; border: 0; border-radius: 6px; padding: 6px 10px; font-size: 12.5px; color: var(--navy); cursor: pointer; min-height: 32px; display: flex; align-items: center; gap: 6px; }
  .tbtn.dark { background: var(--ink); color: #fff; }
  .wbody { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; padding: 6px 12px; font-size: 12.5px; border-bottom: 1px solid #eef0f2; }
  .crumbs button { background: none; border: 0; color: var(--blue); cursor: pointer; padding: 2px 4px; font-size: 12.5px; }
  .crumbs span { color: var(--muted); }
  .frow { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 14px;
          font-size: 14px; cursor: pointer; color: var(--text); min-height: 32px; align-items: center; }
  .frow:hover { background: #f5f7fa; } .frow.on { background: #dbe8fb; }
  .frow .nm { display: flex; align-items: center; gap: 8px; min-width: 0; } .frow .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .dt { color: var(--muted); font-size: 12.5px; }
  .fhead { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 8px; padding: 6px 14px; font-size: 12px; color: var(--muted); border-bottom: 1px solid #eef0f2; }
  .note { padding: 16px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .seg { display: flex; background: #eef1f5; border-radius: 8px; padding: 3px; }
  .seg button { border: 0; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; min-height: 28px; background: transparent; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--navy); font-weight: 600; box-shadow: 0 1px 2px rgba(18,21,42,.12); }
  .save { border: 0; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; min-height: 32px; background: #eef1f5; color: var(--muted); }
  .save.dirty { background: var(--blue); color: #fff; }
  .dirtymark { color: var(--warn); font-family: inherit; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #eef0f2; background: #fafbfc; flex-shrink: 0; }
  .tool { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #d9dde3; border-radius: 6px; padding: 5px 10px; font-size: 13px; color: var(--text); cursor: pointer; min-height: 32px; }
  .tool.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .menuwrap { position: relative; }
  .hmenu { position: absolute; left: 0; top: 38px; z-index: 6; background: #fff; border-radius: 8px; box-shadow: 0 8px 24px rgba(18,21,42,.18); padding: 6px; display: flex; flex-direction: column; min-width: 150px; }
  .hmenu button { text-align: left; background: none; border: 0; padding: 7px 10px; cursor: pointer; border-radius: 6px; color: var(--text); font-weight: 600; }
  .hmenu button:hover { background: #f1f4f8; }
  .hint { font-size: 12px; color: var(--navy); }
  #src { flex: 1; min-height: 0; border: 0; outline: none; resize: none; padding: 14px 16px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 13.5px; line-height: 1.55; color: var(--text); background: #fff; }
  #preview { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px; font-size: 14.5px; line-height: 1.55; }
  #preview [contenteditable="true"] { outline: none; border-radius: 3px; }
  #preview [contenteditable="true"]:focus { box-shadow: 0 0 0 2px #9cc1f2; }
  #preview h1 { font-size: 22px; margin: 6px 0 10px; } #preview h2 { font-size: 18px; margin: 14px 0 8px; } #preview h3 { font-size: 15.5px; margin: 12px 0 6px; }
  #preview h4 { font-size: 14.5px; margin: 10px 0 6px; } #preview h5 { font-size: 13.5px; margin: 10px 0 4px; } #preview h6 { font-size: 12.5px; margin: 10px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #preview .li { display: flex; gap: 8px; margin: 3px 0 3px 6px; } #preview .li > span:last-child { flex: 1; min-width: 40px; min-height: 1.4em; }
  #preview .li .n { min-width: 16px; color: var(--muted); }
  #preview table { border-collapse: collapse; font-size: 13.5px; margin: 8px 0; } #preview td { border: 1px solid #d9dde3; padding: 6px 10px; min-width: 60px; }
  #preview tr:first-child td { background: #f2f3f4; font-weight: 600; }
  #preview p { margin: 6px 0; }
  .disk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: #fff6e0; color: #6b4a00; font-size: 13px; flex-shrink: 0; }

  /* Chat */
  #chat { flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; background: var(--bg); border-radius: 10px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; min-height: 440px; max-height: 100%; }
  #chat.wide { flex: 999 1 560px; }
  .chead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; background: #fff; }
  .chead .t { font-size: 14px; font-weight: 600; } .chead .s { font-size: 12px; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 8px 14px 8px; display: flex; flex-direction: column; }
  #log > :first-child { margin-top: auto; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #fff; flex-shrink: 0; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--navy); }
  .row { display: flex; flex-direction: column; align-items: flex-start; margin: 14px 0 0; }
  .row.cont { margin-top: 6px; } .row.me { align-items: flex-end; }
  .who { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .row.me .who { flex-direction: row-reverse; } .row.cont .who { display: none; }
  .mavatar { width: 28px; height: 28px; border-radius: 50%; background: #fff; color: var(--navy); display: grid; place-items: center; font-size: 11.5px; font-weight: 700; box-shadow: 0 0 0 1px #dfe2e6; flex-shrink: 0; }
  .mavatar.report { background: var(--navy-2); color: #fff; box-shadow: none; }
  .mavatar img, .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .mavatar.pic, .avatar.pic { background: #fff; padding: 0; overflow: hidden; }
  .row.me .mavatar { background: var(--blue); color: #fff; box-shadow: none; }
  .bubble { background: #fff; border-radius: 12px; padding: 10px 14px; font-size: 14.5px; line-height: 1.45; max-width: 82%; margin-left: 36px; box-shadow: 0 1px 1px rgba(18,21,42,.05); overflow-wrap: anywhere; }
  .row.me .bubble { margin-left: 0; margin-right: 36px; background: var(--blue); color: #fff; }
  .row.me .bubble code { background: rgba(255,255,255,.18); color: #fff; } .row.me .bubble a { color: #fff; }
  .bubble p { margin: 4px 0; } .bubble ul, .bubble ol { margin: 4px 0; padding-left: 20px; }
  .bubble code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 12.5px; }
  .bubble .pre { margin: 6px 0; background: var(--ink); color: #e6e6e6; border-radius: 8px; padding: 8px 10px; }
  .bubble .pre pre { margin: 0; font-size: 12.5px; white-space: pre-wrap; font-family: Consolas, monospace; }
  .bubble .pre .acts { display: flex; gap: 6px; margin-top: 8px; }
  .bubble .pre .acts button { background: #2a2e3b; color: #fff; border: 0; border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
  .bubble .pre .acts button.primary { background: var(--blue); }
  .bubble h4 { margin: 8px 0 4px; font-size: 14px; }
  .time { font-size: 11px; color: #858b93; margin: 5px 36px 0; } .row.grouped .time { display: none; }
  .edit-note { margin-top: 8px; font-size: 12.5px; color: var(--navy); background: #eef4fd; border: 1px solid #c9d3e3; border-radius: 8px; padding: 6px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .edit-note button { background: #fff; color: var(--navy); border: 1px solid #c9d3e3; border-radius: 6px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
  .report-kicker { font-size: 12px; color: var(--muted); }
  .day { text-align: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a2a8b0; margin: 14px 0 0; }
  .report-head { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #fff; padding: 2px 8px; border-radius: 10px; background: var(--info); }
  .chip.pass, .chip.passed, .chip.success { background: var(--pass); } .chip.fail, .chip.failed, .chip.error { background: var(--fail); } .chip.partial, .chip.warn, .chip.warning { background: var(--warn); }
  .report-title { font-weight: 600; }
  .stats { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); margin: 4px 0; flex-wrap: wrap; }
  .toggle { background: none; border: 0; color: var(--blue); padding: 0; cursor: pointer; font-size: 13px; margin-top: 6px; }
  .full { display: none; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; } .full.open { display: block; }
  .typing { font-size: 13px; color: var(--muted); padding: 0 14px 4px; min-height: 20px; }
  .toast { margin: 0 14px 8px; background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .sharebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: #eef1f5; flex-shrink: 0; font-size: 13px; }
  .sharebar .q { flex: 1 1 180px; } .sharebar .q b { font-family: Consolas, monospace; font-weight: 600; }
  .pillbtn { background: #fff; color: var(--navy); border: 1px solid #c9d3e3; border-radius: 16px; padding: 6px 12px; font-size: 13px; cursor: pointer; min-height: 32px; }
  .pillbtn.primary { background: var(--blue); color: #fff; border-color: var(--blue); display: flex; align-items: center; gap: 6px; }
  .sharechip { display: flex; align-items: center; gap: 6px; font-size: 12.5px; background: #fff; border-radius: 14px; padding: 4px 4px 4px 10px; box-shadow: 0 0 0 1px #c9d3e3; color: var(--navy); }
  .sharechip button { background: none; border: 0; color: var(--muted); cursor: pointer; width: 24px; height: 24px; border-radius: 50%; }
  .composer { display: flex; align-items: flex-end; gap: 10px; padding: 10px 12px 12px 14px; border-top: 1px solid var(--line); flex-shrink: 0; background: var(--bg); }
  #input { flex: 1; border: 0; background: transparent; outline: none; resize: none; font: inherit; font-size: 15.5px; color: var(--text); max-height: 140px; padding: 9px 0; }
  .send { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--blue); cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
  .send:disabled { opacity: .5; cursor: default; }

  /* Menu panel: slides in from the right, under the header */
  .panel { position: absolute; top: 92px; right: 0; bottom: 0; width: min(420px, 100%); background: var(--bg); transform: translateX(100%); transition: transform .2s ease;
           display: flex; flex-direction: column; z-index: 5; box-shadow: -8px 0 24px rgba(18,21,42,.12); }
  .panel.open { transform: translateX(0); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); background: #fff; }
  .tabs button { flex: 1; background: none; border: 0; padding: 12px; font-size: 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--navy); border-color: var(--navy); font-weight: 600; }
  .tabs .x { flex: 0 0 44px; }
  .pbody { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .team { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 6px; }
  .proj { background: #fff; display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
  .proj:hover { background: #f7f8fa; } .proj.current { border-color: var(--navy); box-shadow: inset 3px 0 0 var(--navy); }
  .proj .meta { flex: 1; min-width: 0; } .proj .n { font-weight: 600; font-size: 14px; } .proj .a { font-size: 12.5px; color: var(--muted); }
  .badge { background: var(--fail); color: #fff; font-size: 11px; border-radius: 10px; padding: 1px 7px; }
  form.add { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; display: grid; gap: 8px; }
  form.add input { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font: inherit; font-size: 14px; }
  form.add button { background: var(--navy); color: #fff; border: 0; border-radius: 4px; padding: 9px; font-size: 14px; cursor: pointer; }
  .linkbtn { background: none; border: 0; color: var(--blue); cursor: pointer; padding: 0; font-size: 13px; }
  .pic-row { display: flex; align-items: center; gap: 10px; margin: 2px 0 6px; font-size: 13px; }
  .rep-item { padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; } .rep-item .d { font-size: 12px; color: var(--muted); }
  .kv { font-size: 13px; margin: 6px 0; } .kv code { background: #fff; padding: 2px 5px; border-radius: 3px; word-break: break-all; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; margin-top: 40px; }
  .flash { animation: flash 1.4s ease; } @keyframes flash { 0% { background: #fff6d6; } 100% { background: #fff; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><div class="t1">Agent Chat</div><div class="t2" id="sub">Loading…</div></div>
    <div class="hbar"><button class="pill" id="menuBtn" aria-expanded="false">Menu</button></div>
  </header>

  <div id="main">
    <nav id="side" aria-label="Chats and files">
      <button class="newchat" id="newChat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
      <div class="sect" id="histTitle">Chat history</div>
      <div id="sessions"></div>
      <div class="divider"></div>
      <button class="sideitem" id="filesBtn" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span><span style="font-size:14px;font-weight:600">Files</span><span class="sub" id="filesSub">No folder set</span></span>
      </button>
      <button class="sect-btn" id="agentToggle" aria-expanded="false" aria-controls="agentList">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        <span id="agentTitle">Agent files</span>
      </button>
      <div id="agentList" hidden></div>
    </nav>

    <section id="work" aria-label="Explorer and editor" hidden>
      <div class="win size-half" id="expWin">
        <div class="whead">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b26a00" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="name">Explorer</span>
          <span class="path" id="expPath"></span>
          <button class="tbtn" id="openExplorer" title="Open this folder in Windows Explorer on the server PC">Open folder</button>
          <button class="tbtn dark" id="openTerminal" title="Open PowerShell in this folder on the server PC"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l6 6-6 6"/><path d="M12 18h8"/></svg>PowerShell</button>
          <button class="ibtn" data-size="exp" data-act="full" aria-label="Full height"></button>
          <button class="ibtn" data-size="exp" data-act="collapse" aria-label="Collapse Explorer"></button>
        </div>
        <div class="wbody" id="expBody"></div>
      </div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const ICON = {
  full: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg>',
  half: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="12" width="16" height="8" rx="1.5"/><path d="M4 7h16"/></svg>',
  up: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>',
  down: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  folder: '<svg width="16" height="16" viewBox="0 0 24 24" fill="#f2c14e" stroke="#b26a00" stroke-width="1.2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  file: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5f6670" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>',
  eye: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
};
const state = {
  projects: [], current: null, info: null, tab: 'projects', unread: {},
  sessions: [], session: null, messages: [], sessUnread: {},
  filesOpen: store.get('filesOpen') === '1', agentOpen: store.get('agentOpen') === '1',
  exp: store.get('exp') || 'half', ed: store.get('ed') || 'half', mode: store.get('mode') || 'edit',
  dir: '', entries: [], selected: '', doc: null, active: null, shared: null
};

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}
const P = () => `/api/projects/${encodeURIComponent(state.current)}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3200); }

// ---------- message Markdown (chat bubbles) ----------
function md(src, withActions) {
  const blocks = [];
  let s = esc(src).replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, c) => {
    const one = c.trim().split('\n').length === 1;
    blocks.push(`<div class="pre"><pre>${c.replace(/\n$/, '')}</pre>${withActions ? `<div class="acts"><button data-copy>Copy</button>${one ? '<button class="primary" data-ps>Open PowerShell here</button>' : ''}</div>` : ''}</div>`);
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const out = []; let list = '';
  for (const line of s.split('\n')) {
    const li = line.match(/^\s*[-*]\s+(.*)/), ol = line.match(/^\s*\d+\.\s+(.*)/), h = line.match(/^#{1,6}\s+(.*)/);
    const want = li ? 'ul' : ol ? 'ol' : '';
    if (list && want !== list) { out.push(`</${list}>`); list = ''; }
    if (want) { if (!list) { out.push(`<${want}>`); list = want; } out.push('<li>' + (li || ol)[1] + '</li>'); continue; }
    if (h) out.push('<h4>' + h[1] + '</h4>'); else if (line.trim()) out.push('<p>' + line + '</p>');
  }
  if (list) out.push(`</${list}>`);
  return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}
const initials = n => String(n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtDay = ts => new Date(ts).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
function dayLabel(ts) {
  const d = new Date(ts), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return fmtDay(ts);
}
function project() { return state.projects.find(p => p.id === state.current); }
function agentPic(projectId, author) {
  const pr = state.projects.find(p => p.id === projectId);
  return pr && pr.avatar && String(author).toLowerCase() === String(pr.agent).toLowerCase() ? pr.avatar : '';
}
function avatarInner(pic, name) { return pic ? `<img src="${esc(pic)}" alt="">` : esc(initials(name)); }
function sameGroup(a, b) {
  return a && b && a.author === b.author && (a.role === 'user') === (b.role === 'user') &&
    fmtDay(a.ts) === fmtDay(b.ts) && (new Date(b.ts) - new Date(a.ts)) < 5 * 60 * 1000;
}

// ---------- chat log ----------
function renderMessage(m, cont) {
  const me = m.role === 'user';
  const row = document.createElement('div');
  row.className = 'row' + (me ? ' me' : '') + (cont ? ' cont' : '');
  row.id = 'm-' + m.id;
  let inner;
  if (m.role === 'report') {
    const r = m.report, st = r.stats || {};
    const stats = Object.keys(st).length ? `<div class="stats">${Object.entries(st).map(([k, v]) => `<span><b>${esc(v)}</b> ${esc(k)}</span>`).join('')}</div>` : '';
    inner = `<div class="report-kicker">Nightly report · ${esc(r.runDate)}</div>
      <div class="report-head"><span class="chip ${esc(r.status)}">${esc(r.status)}</span><span class="report-title">${esc(r.title)}</span></div>
      ${stats}${r.summary ? md(r.summary) : ''}
      ${r.body || r.link ? `<button class="toggle">View full report</button><div class="full">${md(r.body)}${r.link ? `<p><a href="${esc(r.link)}" target="_blank" rel="noopener">${/github\.com/.test(r.link) ? 'Open on GitHub' : 'Open link'}</a></p>` : ''}</div>` : ''}`;
  } else {
    inner = md(m.text, m.role === 'assistant');
    if (m.edit) inner += `<div class="edit-note">${m.edit.undone ? 'Undone: <code>' + esc(m.edit.file) + '</code> is back to the previous version' : 'Edited <code>' + esc(m.edit.file) + '</code> · backup kept'}${m.edit.undone ? '' : ' <button class="undo">Undo</button>'}</div>`;
  }
  const pic = me ? '' : agentPic(m.projectId, m.author);
  row.innerHTML = `<div class="who"><div class="mavatar ${pic ? 'pic' : m.role === 'report' ? 'report' : ''}">${avatarInner(pic, m.author)}</div><span>${esc(m.author)}</span></div>
    <div class="bubble">${inner}</div><div class="time">${fmtTime(m.ts)}</div>`;
  const u = row.querySelector('.undo');
  if (u) u.onclick = async () => { u.disabled = true; try { await api(`${P()}/undo/${m.id}`, { method: 'POST' }); } catch (e) { toast('Undo failed: ' + e.message); u.disabled = false; } };
  const t = row.querySelector('.toggle');
  if (t) t.onclick = () => { const f = row.querySelector('.full'); f.classList.toggle('open'); t.textContent = f.classList.contains('open') ? 'Hide full report' : 'View full report'; };
  row.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    const text = b.closest('.pre').querySelector('pre').textContent;
    try { await navigator.clipboard.writeText(text); toast('Copied.'); } catch { toast('Copy failed; select the text instead.'); }
  });
  row.querySelectorAll('[data-ps]').forEach(b => b.onclick = async () => {
    const text = b.closest('.pre').querySelector('pre').textContent;
    try { await navigator.clipboard.writeText(text); } catch {}
    openOnPc('terminal', 'Command copied. Paste it in the PowerShell window.');
  });
  return row;
}
function renderLog() {
  const log = $('#log'); log.innerHTML = '';
  if (!state.messages.length) { log.innerHTML = '<div class="empty">' + (currentSession() && currentSession().kind === 'reports' ? 'No reports yet.' : 'New chat. Ask anything, or share a file with Read this file.') + '</div>'; return; }
  let prev = null;
  for (const m of state.messages) {
    if (!prev || fmtDay(prev.ts) !== fmtDay(m.ts)) log.insertAdjacentHTML('beforeend', `<div class="day">${dayLabel(m.ts)}</div>`);
    const cont = sameGroup(prev, m);
    if (cont) document.getElementById('m-' + prev.id).classList.add('grouped');
    log.appendChild(renderMessage(m, cont));
    prev = m;
  }
  log.scrollTop = log.scrollHeight;
}
function appendMessage(m) {
  const log = $('#log');
  if (log.querySelector('.empty')) log.innerHTML = '';
  const prev = state.messages[state.messages.length - 2];
  if (!prev || fmtDay(prev.ts) !== fmtDay(m.ts)) log.insertAdjacentHTML('beforeend', `<div class="day">${dayLabel(m.ts)}</div>`);
  const cont = sameGroup(prev, m);
  if (cont) { const el = document.getElementById('m-' + prev.id); if (el) el.classList.add('grouped'); }
  log.appendChild(renderMessage(m, cont));
  log.scrollTop = log.scrollHeight;
}

// ---------- header, projects ----------
function setHeader() {
  const p = project();
  $('#sub').textContent = p ? `${p.agent} · ${p.name}` : 'No project selected';
  const total = Object.values(state.unread).reduce((a, b) => a + b, 0);
  $('#menuBtn').textContent = total ? `Menu (${total})` : 'Menu';
  if (p) {
    $('#histTitle').textContent = `${p.agent} · chat history`;
    $('#agentTitle').textContent = `${p.agent}'s files`;
    const pic = p.avatar; const a = $('#chatAvatar');
    a.className = 'mavatar' + (pic ? ' pic' : ''); a.innerHTML = avatarInner(pic, p.agent);
    $('#filesSub').textContent = p.workspace ? p.workspace.split(/[\\/]/).filter(Boolean).slice(-2).join('\\') : 'No folder set';
  }
}
async function loadProjects() {
  state.projects = await api('/api/projects');
  if (!state.projects.find(p => p.id === state.current)) {
    const saved = store.get('project');
    state.current = saved && state.projects.find(p => p.id === saved) ? saved : (state.projects[0] || {}).id;
  }
}
async function selectProject(id) {
  if (!(await confirmDiscard())) return;
  state.current = id; store.set('project', id); state.unread[id] = 0;
  state.doc = null; state.shared = null; state.dir = ''; state.selected = '';
  setHeader(); closePanel();
  await loadSessions();
  const want = store.get('session:' + id);
  await selectSession(state.sessions.find(s => s.id === want) ? want : (state.sessions.find(s => s.kind === 'chat') || state.sessions[0]).id);
  renderAgentFiles(); renderEditor(); if (state.filesOpen) loadDir('');
}

// ---------- sessions (chat history) ----------
function currentSession() { return state.sessions.find(s => s.id === state.session); }
async function loadSessions() { state.sessions = await api(`${P()}/sessions`); renderSessions(); }
function renderSessions() {
  const box = $('#sessions'); box.innerHTML = '';
  let last = '';
  for (const s of state.sessions) {
    const g = s.kind === 'reports' ? 'Pinned' : dayLabel(s.updatedAt) === 'Today' ? 'Today' : dayLabel(s.updatedAt) === 'Yesterday' ? 'Yesterday' : 'Earlier';
    if (g !== last) { box.insertAdjacentHTML('beforeend', `<div class="grp">${g}</div>`); last = g; }
    const el = document.createElement('div');
    el.className = 'sess' + (s.id === state.session ? ' on' : '') + (state.sessUnread[s.id] ? ' unread' : '');
    el.innerHTML = `<button class="pick" title="${esc(s.title)}">${esc(s.title)}</button>${s.kind === 'chat' ? '<button class="del" aria-label="Delete this chat" title="Delete this chat">✕</button>' : ''}`;
    el.querySelector('.pick').onclick = () => selectSession(s.id);
    const d = el.querySelector('.del');
    if (d) d.onclick = async () => {
      if (!confirm(`Delete the chat "${s.title}"? Its messages are removed.`)) return;
      await api(`${P()}/sessions/${s.id}`, { method: 'DELETE' });
      if (state.session === s.id) state.session = null;
      await loadSessions();
      if (!state.session) await selectSession((state.sessions.find(x => x.kind === 'chat') || state.sessions[0]).id);
    };
    box.appendChild(el);
  }
}
async function selectSession(id) {
  state.session = id; state.sessUnread[id] = 0; store.set('session:' + state.current, id);
  state.messages = await api(`${P()}/messages?session=${encodeURIComponent(id)}`);
  const s = currentSession(); const p = project();
  $('#sessTitle').textContent = s ? s.title : 'Chat';
  $('#sessSub').textContent = p ? (s && s.kind === 'reports' ? 'Imported from GitHub and the report endpoint' : `${p.agent} · ${p.name} · reads files and GitHub`) : '';
  $('#typing').textContent = '';
  renderSessions(); renderLog();
}
async function newChat() {
  const s = await api(`${P()}/sessions`, { method: 'POST', body: '{}' });
  await loadSessions(); await selectSession(s.id); $('#input').focus();
}

// ---------- Files: Explorer ----------
function setFilesOpen(on) {
  state.filesOpen = on; store.set('filesOpen', on ? '1' : '0');
  $('#work').hidden = !on; $('#chat').classList.toggle('wide', !on);
  $('#filesBtn').classList.toggle('on', on); $('#filesBtn').setAttribute('aria-pressed', on);
  if (on) { applySizes(); loadDir(state.dir); }
}
async function loadDir(dir) {
  const body = $('#expBody'); const p = project();
  if (!p) return;
  $('#expPath').textContent = p && p.workspace ? p.workspace + (dir ? '\\' + dir.replace(/\//g, '\\') : '') : '';
  try {
    const r = await api(`${P()}/files?dir=${encodeURIComponent(dir || '')}`);
    state.dir = r.dir; state.entries = r.entries;
  } catch (e) {
    body.innerHTML = `<div class="note">${esc(e.message)}<br><button class="linkbtn" id="setFolder">Set the project folder</button></div>`;
    const b = $('#setFolder'); if (b) b.onclick = () => openPanel('projects');
    return;
  }
  const parts = state.dir ? state.dir.split('/') : [];
  const crumbs = [`<button data-dir="">${esc((p.workspace || '').split(/[\\/]/).filter(Boolean).pop() || 'folder')}</button>`]
    .concat(parts.map((x, i) => `<span>›</span><button data-dir="${esc(parts.slice(0, i + 1).join('/'))}">${esc(x)}</button>`));
  body.innerHTML = `<div class="crumbs">${crumbs.join('')}</div><div class="fhead"><span>Name</span><span>Date modified</span></div>` +
    (state.dir ? `<button class="frow" data-up><span class="nm">${ICON.folder}<span>..</span></span><span class="dt"></span></button>` : '') +
    state.entries.map(e => `<button class="frow${state.selected === e.path ? ' on' : ''}" data-path="${esc(e.path)}" data-isdir="${e.dir ? 1 : 0}" data-edit="${e.editable ? 1 : 0}" title="${esc(e.path)}">
      <span class="nm">${e.dir ? ICON.folder : ICON.file}<span>${esc(e.name)}</span></span><span class="dt">${e.mtime ? esc(new Date(e.mtime).toLocaleString([], { month: 'numeric', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })) : ''}</span></button>`).join('') +
    (state.entries.length ? '' : '<div class="note">This folder is empty.</div>');
  body.querySelectorAll('[data-dir]').forEach(b => b.onclick = () => loadDir(b.dataset.dir));
  const up = body.querySelector('[data-up]'); if (up) up.onclick = () => loadDir(parts.slice(0, -1).join('/'));
  body.querySelectorAll('.frow[data-path]').forEach(b => b.onclick = async () => {
    const path = b.dataset.path;
    if (b.dataset.isdir === '1') return loadDir(path);
    state.selected = path; body.querySelectorAll('.frow').forEach(x => x.classList.toggle('on', x === b));
    if (b.dataset.edit === '1') await openDoc({ kind: 'file', path });
    else toast('Only .md and .txt files open here. Use Open in Explorer for this one.');
  });
}
async function openOnPc(what, okText) {
  try { await api(`${P()}/open`, { method: 'POST', body: JSON.stringify({ what, dir: state.dir }) }); toast(okText || (what === 'terminal' ? 'Opened PowerShell in this folder.' : 'Opened Windows Explorer.')); }
  catch (e) { toast(e.message); }
}

// ---------- window sizes: full / half / collapsed ----------
function sizes(which, to) {
  const other = which === 'exp' ? 'ed' : 'exp';
  state[which] = to;
  if (to === 'full') state[other] = 'collapsed';
  if (to !== 'full' && state[other] === 'collapsed' && to !== 'collapsed') state[other] = 'half';
  if (to === 'collapsed' && state[other] === 'collapsed') state[other] = 'half';
  if (to === 'collapsed' && state[other] === 'full') state[other] = 'full';
  store.set('exp', state.exp); store.set('ed', state.ed);
  applySizes();
}
function applySizes() {
  for (const [k, id] of [['exp', '#expWin'], ['ed', '#edWin']]) {
    const w = $(id); w.className = 'win size-' + state[k];
    const full = w.querySelector('[data-act="full"]'), col = w.querySelector('[data-act="collapse"]');
    full.innerHTML = state[k] === 'full' ? ICON.half : ICON.full; full.setAttribute('aria-label', state[k] === 'full' ? 'Half height' : 'Full height'); full.title = full.getAttribute('aria-label');
    col.innerHTML = state[k] === 'collapsed' ? ICON.down : ICON.up; col.setAttribute('aria-label', state[k] === 'collapsed' ? 'Expand' : 'Collapse'); col.title = col.getAttribute('aria-label');
  }
}
document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => {
  const k = b.dataset.size, cur = state[k];
  if (b.dataset.act === 'full') sizes(k, cur === 'full' ? 'half' : 'full');
  else sizes(k, cur === 'collapsed' ? 'half' : 'collapsed');
});

// ---------- agent files (sidebar, collapsible) ----------
function setAgentOpen(on) {
  state.agentOpen = on; store.set('agentOpen', on ? '1' : '0');
  $('#agentToggle').setAttribute('aria-expanded', on); $('#agentList').hidden = !on;

// Markdown → editable blocks for Preview, each tied to its source lines
function parseBlocks(mdText) {
  const lines = mdText.split('\n'); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (/^\s*\|/.test(l)) {
      const start = i; const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { if (!/^\s*\|\s*:?-{3,}/.test(lines[i])) rows.push(lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())); i++; }
      out.push({ kind: 'table', start, end: i - 1, rows }); continue;
    }
    if ((m = l.match(/^(#{1,6})\s(.*)$/))) out.push({ kind: 'h', level: m[1].length, start: i, end: i, text: m[2] });
    else if ((m = l.match(/^\s*[-*]\s(.*)$/)) && !/^\*\*/.test(l)) out.push({ kind: 'ul', start: i, end: i, text: m[1] });
    else if ((m = l.match(/^\s*(\d+)\.\s(.*)$/))) out.push({ kind: 'ol', num: m[1], start: i, end: i, text: m[2] });
    else if ((m = l.match(/^\*\*([^*]+?):\*\*\s?(.*)$/))) out.push({ kind: 'label', start: i, end: i, label: m[1], value: m[2] });
    else if (l.trim()) out.push({ kind: 'p', start: i, end: i, text: l });
    i++;
  }
  return out;
}
function replaceLines(start, end, newLines) {
  const lines = state.doc.content.split('\n'); lines.splice(start, end - start + 1, ...newLines); setDoc(lines.join('\n'));
}
function tableLines(rows) { const line = r => '| ' + r.join(' | ') + ' |'; return [line(rows[0]), '| ' + rows[0].map(() => '---').join(' | ') + ' |'].concat(rows.slice(1).map(line)); }
let focusBlock = -1;
function renderPreview() {
  const box = $('#preview'); const d = state.doc;
  if (!d) { box.innerHTML = '<div class="note">Open a file to preview it.</div>'; return; }
  const blocks = parseBlocks(d.content);
  box.innerHTML = '<div class="muted" style="font-size:11.5px;margin-bottom:8px">Click any line to edit it here.</div>' + blocks.map((b, i) => {
    const ce = `contenteditable="true" data-b="${i}"`;
    if (b.kind === 'h') return `<h${b.level} ${ce} data-f="text">${esc(b.text)}</h${b.level}>`;
    if (b.kind === 'ul') return `<div class="li"><span aria-hidden="true">•</span><span ${ce} data-f="text">${esc(b.text)}</span></div>`;
    if (b.kind === 'ol') return `<div class="li"><span class="n">${esc(b.num)}.</span><span ${ce} data-f="text">${esc(b.text)}</span></div>`;
    if (b.kind === 'label') return `<div style="margin:4px 0"><b ${ce} data-f="label">${esc(b.label)}</b><b>: </b><span ${ce} data-f="value">${esc(b.value)}</span></div>`;
    if (b.kind === 'table') return `<div style="overflow-x:auto"><table><tbody>${b.rows.map((r, ri) => `<tr>${r.map((c, ci) => `<td ${ce} data-f="cell" data-r="${ri}" data-c="${ci}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    return `<p ${ce} data-f="text">${esc(b.text)}</p>`;
  }).join('');
  box.querySelectorAll('[data-b]').forEach(el => {
    el.onfocus = () => { focusBlock = Number(el.dataset.b); };
    el.onblur = () => {
      const b = blocks[Number(el.dataset.b)]; const f = el.dataset.f;
      const t = el.innerText.replace(/\n+/g, ' ').trim();
      if (f === 'text') { if (t === b.text) return; const pre = b.kind === 'h' ? '#'.repeat(b.level) + ' ' : b.kind === 'ul' ? '- ' : b.kind === 'ol' ? b.num + '. ' : ''; replaceLines(b.start, b.end, [pre + t]); }
      else if (f === 'label') { if (t === b.label) return; replaceLines(b.start, b.end, ['**' + t + ':** ' + b.value]); }
      else if (f === 'value') { if (t === b.value) return; replaceLines(b.start, b.end, ['**' + b.label + ':** ' + t]); }
      else if (f === 'cell') { const ri = Number(el.dataset.r), ci = Number(el.dataset.c); const v = t.replace(/\|/g, '/'); if (v === b.rows[ri][ci]) return; const rows = b.rows.map(x => x.slice()); rows[ri][ci] = v; replaceLines(b.start, b.end, tableLines(rows)); }
      setTimeout(() => { if (!$('#preview').contains(document.activeElement)) renderPreview(); }, 0);
    };
    el.onkeydown = e => { if (e.key === 'Enter' && el.dataset.f !== 'cell') { e.preventDefault(); el.blur(); } };
  });
}

// ---------- toolbar: line tools and bracket tools ----------
// Line tools put a prefix at the start of the line, no sample text.
// Bracket tools insert open + close marks; type between them and leave with →,
// by typing the closing mark yourself, or by clicking the tool again (the marks stay).
function caretPos() { const s = $('#src'); return s.selectionStart ?? state.doc.content.length; }
function placeCaret(c) { const s = $('#src'); s.focus(); s.setSelectionRange(c, c); }
function insertSnippetPreview(text) {
  const blocks = parseBlocks(state.doc.content); const b = blocks[focusBlock];
  const lines = state.doc.content.split('\n'); const at = b ? b.end + 1 : lines.length;
  lines.splice(at, 0, ...text.split('\n')); setDoc(lines.join('\n')); renderPreview();
}
function prefixTool(prefix) {
  if (!state.doc) return toast('Open a file first.');
  if (state.mode !== 'edit') return insertSnippetPreview(prefix);
  const doc = state.doc.content; const at = caretPos();
  const ls = doc.lastIndexOf('\n', at - 1) + 1; let le = doc.indexOf('\n', at); if (le === -1) le = doc.length;
  const line = doc.slice(ls, le); let next, caret;
  if (!line.trim()) { next = doc.slice(0, ls) + prefix + doc.slice(le); caret = ls + prefix.length; }
  else { next = doc.slice(0, le) + '\n' + prefix + doc.slice(le); caret = le + 1 + prefix.length; }
  state.active = null; setDoc(next); placeCaret(caret); renderToolState();
}
function insertBlock(text) {
  if (!state.doc) return toast('Open a file first.');
  if (state.mode !== 'edit') return insertSnippetPreview(text);
  const doc = state.doc.content; const at = caretPos();
  const before = doc.slice(0, at); const pre = before && !before.endsWith('\n') ? '\n' : '';
  setDoc(before + pre + text + '\n' + doc.slice(at)); placeCaret(at + pre.length + text.length + 1);
}
function wrapTool(tool, open, close) {
  if (!state.doc) return toast('Open a file first.');
  const a = state.active;
  if (a && a.tool === tool) { state.active = null; placeCaret(a.closeAt + a.close.length); return renderToolState(); }
  if (state.mode !== 'edit') return insertSnippetPreview(open + 'Label' + close);
  const doc = state.doc.content; const at = caretPos();
  setDoc(doc.slice(0, at) + open + close + doc.slice(at));
  const inside = at + open.length;
  state.active = { tool, open, close, openAt: inside, closeAt: inside };
  placeCaret(inside); renderToolState();
}
function renderToolState() {
  const a = state.active; const lb = $('#labelBtn');
  lb.classList.toggle('on', !!(a && a.tool === 'label')); lb.setAttribute('aria-pressed', !!(a && a.tool === 'label'));
  lb.title = a && a.tool === 'label' ? 'Exit label (keeps the marks)' : 'Label: **…:**';
  const h = $('#toolHint'); h.hidden = !a; h.textContent = a ? `Typing inside ${a.open}…${a.close.trim()} · press → or click the tool again to exit` : '';
}

$('#headBtn').onclick = () => { const m = $('#headMenu'); m.hidden = !m.hidden; $('#headBtn').setAttribute('aria-expanded', !m.hidden); };
$('#headMenu').querySelectorAll('[data-h]').forEach(b => b.onclick = () => { $('#headMenu').hidden = true; $('#headBtn').setAttribute('aria-expanded', false); prefixTool('#'.repeat(Number(b.dataset.h)) + ' '); });

$('#src').addEventListener('input', e => {

  let a = state.active;

    a = next.slice(closeAt, closeAt + a.close.length) === a.close ? { ...a, closeAt } : null;

});
['click', 'keyup', 'select'].forEach(ev => $('#src').addEventListener(ev, e => {

}));

// ---------- send ----------
async function send(textArg) {
  const input = $('#input'); const text = (typeof textArg === 'string' ? textArg : input.value).trim();
  if (!text || !state.current) return;
  if (typeof textArg !== 'string') { input.value = ''; autosize(); }
  $('#sendBtn').disabled = true;
  try {
    let s = currentSession();
    if (!s || s.kind !== 'chat') { s = await api(`${P()}/sessions`, { method: 'POST', body: '{}' }); await loadSessions(); await selectSession(s.id); }
    if (state.shared && state.doc && docKey(state.doc) === state.shared.key && dirty()) await saveDoc(); // the agent reads the saved file
    const r = await api(`${P()}/chat`, { method: 'POST', body: JSON.stringify({ text, session: s.id, context: shareContext() }) });
    if (r.session && r.session !== state.session) await selectSession(r.session);
  } catch (e) { toast('Send failed: ' + e.message); }
  finally { $('#sendBtn').disabled = false; input.focus(); }
}
function autosize() { const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }

  }
}
// This computer: Server or Connected. Desktop app only.
async function loadMode() {
  const box = $('#modeBox'); if (!box || !window.pc) return;
  const d = await window.pc.get();
  box.innerHTML = `
    <div class="team">This computer</div>
    <form class="add" id="modeForm" style="border-top:0;margin-top:4px;padding-top:0">
      <label class="kv" style="display:flex;gap:8px;align-items:center"><input type="radio" name="mode" value="server" ${d.mode !== 'client' ? 'checked' : ''}> <b>Server</b><span class="muted">keeps the chat and receives reports</span></label>
      <label class="kv" style="display:flex;gap:8px;align-items:center"><input type="radio" name="mode" value="client" ${d.mode === 'client' ? 'checked' : ''}> <b>Connected</b><span class="muted">opens the server PC's chat</span></label>
      <input name="url" placeholder="Server address, e.g. 100.x.x.x:3500" value="${esc((d.serverUrl || '').replace(/^http:\/\//, ''))}">
      <div style="display:flex;gap:8px"><button type="button" id="modeTest" style="flex:1;background:#e3e7ee;color:var(--navy)">Test connection</button><button style="flex:1">Save and restart</button></div>
      <div class="muted" id="modeStatus">${d.mode === 'client' ? 'Connected to ' + esc(d.serverUrl) : 'Running as the server. On the other computer, choose Connected and enter an address from Open from other computers below.'}</div>
    </form>`;
  const f = $('#modeForm'), st = $('#modeStatus');
  const mode = () => f.querySelector('input[name=mode]:checked').value;
  f.url.onfocus = () => { f.querySelector('input[value=client]').checked = true; };
  $('#modeTest').onclick = async () => { if (!f.url.value.trim()) return (st.textContent = 'Enter the server address first.'); st.textContent = 'Testing…'; const r = await window.pc.test(f.url.value); st.textContent = r.ok ? 'Reachable. Save and restart to connect.' : r.error; };
  f.onsubmit = async e => { e.preventDefault(); if (mode() === 'client' && !f.url.value.trim()) return (st.textContent = 'Enter the server address.'); st.textContent = mode() === 'client' ? 'Testing, then restarting…' : 'Restarting as the server…'; const r = await window.pc.save(mode(), f.url.value); if (r && !r.ok) st.textContent = r.error; };
}
function ghStatusText(r) {
  if (!r || !r.github) return 'Not set. Reports only arrive through the report endpoint.';
  const st = r.status || {};
  const when = st.lastCheck ? new Date(st.lastCheck).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'not yet';
  return st.lastError ? `Last check ${when}: ${st.lastError}` : `Watching ${r.github.repo} #${r.github.issue}. Last check ${when}; ${st.imported || 0} imported this session. Checks every ${r.pollMinutes || 5} min.`;
}
async function loadGithub() {
  const f = $('#ghForm'); if (!f || !state.current) return;
  const url = `${P()}/github`;
  const r = await api(url).catch(e => ({ error: e.message }));
  if (r.github) { f.repo.value = r.github.repo; f.issue.value = r.github.issue; }
  $('#ghStatus').textContent = r.error || ghStatusText(r);
  f.onsubmit = async e => { e.preventDefault(); $('#ghStatus').textContent = 'Saving and checking…'; try { const x = await api(url, { method: 'PUT', body: JSON.stringify({ repo: f.repo.value, issue: f.issue.value }) }); $('#ghStatus').textContent = ghStatusText({ ...x, pollMinutes: r.pollMinutes }); } catch (err) { $('#ghStatus').textContent = err.message; } };
  $('#ghCheck').onclick = async () => { $('#ghStatus').textContent = 'Checking…'; try { await api(url, { method: 'POST' }); const x = await api(url); $('#ghStatus').textContent = ghStatusText(x); } catch (err) { $('#ghStatus').textContent = err.message; } };
}
async function setAgentPicture(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight), S = 256;
    const c = document.createElement('canvas'); c.width = c.height = S;
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
    await api(`${P()}/avatar`, { method: 'POST', body: JSON.stringify({ dataUrl: c.toDataURL('image/png') }) });
    await loadProjects(); setHeader(); renderLog(); renderPanel();
  } catch (e) { toast('Could not use that picture: ' + (e.message || 'unreadable image')); }
  finally { URL.revokeObjectURL(url); }
}

// ---------- live updates ----------
let typingTimer;
function connectEvents() {
  const es = new EventSource('/api/events');
  es.onmessage = async e => {
    const evt = JSON.parse(e.data);
    if (evt.type === 'message') {
      const m = evt.message;
      if (m.projectId !== state.current) { state.unread[m.projectId] = (state.unread[m.projectId] || 0) + 1; setHeader(); }
      else if (m.sessionId === state.session) {
        if (!state.messages.some(x => x.id === m.id)) { state.messages.push(m); appendMessage(m); }
        if (m.role === 'assistant') $('#typing').textContent = '';
      } else { state.sessUnread[m.sessionId] = 1; const s = state.sessions.find(x => x.id === m.sessionId); if (s) s.updatedAt = m.ts; renderSessions(); }
      if (m.role === 'report' && document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification(`${m.author}: ${m.report.status.toUpperCase()}`, { body: m.report.title });
    } else if (evt.type === 'updated' && evt.message.sessionId === state.session) {
      const i = state.messages.findIndex(x => x.id === evt.message.id);
      if (i > -1) { state.messages[i] = evt.message; renderLog(); }
    } else if (evt.type === 'pruned' && evt.sessionId === state.session) {
      const gone = new Set(evt.ids); state.messages = state.messages.filter(m => !gone.has(m.id)); renderLog();
    } else if (evt.type === 'typing' && evt.projectId === state.current && evt.sessionId === state.session) {
      $('#typing').textContent = `${evt.author} is typing…`;
      clearTimeout(typingTimer); typingTimer = setTimeout(() => { $('#typing').textContent = ''; }, 180000);
    } else if (evt.type === 'sessions' && evt.projectId === state.current) {
      await loadSessions(); const s = currentSession(); if (s) $('#sessTitle').textContent = s.title;
    } else if (evt.type === 'file-changed' && evt.projectId === state.current && state.doc) {
      const d = state.doc; const p = project();
      const match = d.kind === 'agent' ? evt.file === `${p.agent} / ${d.name}.md` : evt.file === d.path;
      if (!match || evt.by === 'user') return;
      if (!dirty()) { await reloadDoc(); toast(`${docDisplay(d)} was changed. Reloaded.`); }
      else { const bar = $('#diskBar'); bar.hidden = false; bar.innerHTML = `${esc(docDisplay(d))} changed on disk. <button class="pillbtn" id="reloadDisk">Reload (lose my changes)</button><button class="pillbtn" id="keepMine">Keep mine</button>`;
        $('#reloadDisk').onclick = () => reloadDoc(); $('#keepMine').onclick = () => { bar.hidden = true; }; }
    } else if (evt.type === 'projects') { await loadProjects(); setHeader(); renderLog(); if ($('#panel').classList.contains('open') && state.tab !== 'projects') renderPanel(); }
  };
}
window.addEventListener('beforeunload', e => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  state.info = await api('/api/info').catch(() => null);
  setAgentOpen(state.agentOpen); applySizes(); setFilesOpen(state.filesOpen);
  await loadProjects();
  if (state.current) await selectProject(state.current); else { setHeader(); renderLog(); }
  connectEvents();
  if ('Notification' in window && Notification.permission === 'default') document.body.addEventListener('click', () => Notification.requestPermission(), { once: true });
})();
</script>
