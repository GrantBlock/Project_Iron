<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;box-sizing:border-box;min-height:100vh;background:var(--bg-canvas)}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.glass{background:linear-gradient(var(--glass-fill-strong),var(--glass-fill-strong)) padding-box,var(--glass-border) border-box;border:1px solid transparent;box-shadow:var(--shadow-2)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;height:160px"><div style="border-radius:var(--radius-xl);background:var(--grain),var(--ambient-ember),var(--bg-app);box-shadow:inset 0 0 0 1px var(--line-1);padding:14px;display:flex;align-items:flex-end"><span class="mono">ambient-ember + grain</span></div><div style="border-radius:var(--radius-xl);background:var(--grain),var(--ambient-signal),var(--bg-app);box-shadow:inset 0 0 0 1px var(--line-1);padding:14px;display:flex;align-items:flex-end"><span class="mono">ambient-signal + grain — hero moments only</span></div></div></body></html>
