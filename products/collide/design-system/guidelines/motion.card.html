<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="Quick ease-out; snap only on placement" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;box-sizing:border-box;min-height:100vh;background:var(--bg-canvas)}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.glass{background:linear-gradient(var(--glass-fill-strong),var(--glass-fill-strong)) padding-box,var(--glass-border) border-box;border:1px solid transparent;box-shadow:var(--shadow-2)}
@keyframes slide{0%,15%{transform:translateX(0)}55%,100%{transform:translateX(220px)}}.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}</style></head><body><div style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;align-items:center;gap:16px"><span class="mono" style="width:150px">ease-out · dur-3</span><div style="width:240px;height:12px;position:relative;background:var(--pattern-ticks);background-repeat:repeat-x;background-size:auto 4px;background-position:0 center"><div class="dot" style="animation:slide 2.4s var(--ease-out) infinite alternate"></div></div><span class="mono">hover, panels, menus</span></div><div style="display:flex;align-items:center;gap:16px"><span class="mono" style="width:150px">ease-in-out · dur-4</span><div style="width:240px;height:12px;position:relative;background:var(--pattern-ticks);background-repeat:repeat-x;background-size:auto 4px;background-position:0 center"><div class="dot" style="animation:slide 2.4s var(--ease-in-out) infinite alternate"></div></div><span class="mono">page + overlay transitions</span></div><div style="display:flex;align-items:center;gap:16px"><span class="mono" style="width:150px">ease-snap · dur-3</span><div style="width:240px;height:12px;position:relative;background:var(--pattern-ticks);background-repeat:repeat-x;background-size:auto 4px;background-position:0 center"><div class="dot" style="animation:slide 2.4s var(--ease-snap) infinite alternate"></div></div><span class="mono">markup placement, callout drop</span></div></div></body></html>
