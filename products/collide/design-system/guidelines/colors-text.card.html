<!-- @dsCard group="Colors" viewport="700x150" name="Text & lines" subtitle="Four text tiers; hairlines are white at low alpha" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;box-sizing:border-box;min-height:100vh;background:var(--bg-canvas)}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.glass{background:linear-gradient(var(--glass-fill-strong),var(--glass-fill-strong)) padding-box,var(--glass-border) border-box;border:1px solid transparent;box-shadow:var(--shadow-2)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px"><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-1);font-size:15px">Collide text 1</span><span class="mono">--text-1</span></div><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-2);font-size:15px">Collide text 2</span><span class="mono">--text-2</span></div><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-3);font-size:15px">Collide text 3</span><span class="mono">--text-3</span></div><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-4);font-size:15px">Collide text 4</span><span class="mono">--text-4</span></div></div>
 <div style="display:flex;flex-direction:column;gap:12px;justify-content:center"><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;height:1px;background:var(--line-1)"></div><span class="mono" style="width:80px">line-1</span></div><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;height:1px;background:var(--line-2)"></div><span class="mono" style="width:80px">line-2</span></div><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;height:1px;background:var(--line-3)"></div><span class="mono" style="width:80px">line-3</span></div><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;height:1px;background:var(--line-strong)"></div><span class="mono" style="width:80px">line-strong</span></div><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;border-top:1px dashed var(--line-dashed)"></div><span class="mono" style="width:80px">line-dashed</span></div></div></div></body></html>
