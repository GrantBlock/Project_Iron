<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="Tight on controls, soft on panels, pill for chips" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;box-sizing:border-box;min-height:100vh;background:var(--bg-canvas)}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.glass{background:linear-gradient(var(--glass-fill-strong),var(--glass-fill-strong)) padding-box,var(--glass-border) border-box;border:1px solid transparent;box-shadow:var(--shadow-2)}
</style></head><body><div class="row" style="gap:14px"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div class="glass" style="width:70px;height:70px;border-radius:var(--radius-xs)"></div><span class="mono">xs · 4</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div class="glass" style="width:70px;height:70px;border-radius:var(--radius-sm)"></div><span class="mono">sm · 6</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div class="glass" style="width:70px;height:70px;border-radius:var(--radius-md)"></div><span class="mono">md · 10</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div class="glass" style="width:70px;height:70px;border-radius:var(--radius-lg)"></div><span class="mono">lg · 14</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div class="glass" style="width:70px;height:70px;border-radius:var(--radius-xl)"></div><span class="mono">xl · 20</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div class="glass" style="width:70px;height:70px;border-radius:var(--radius-2xl)"></div><span class="mono">2xl · 28</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div class="glass" style="width:96px;height:70px;border-radius:var(--radius-pill)"></div><span class="mono">pill · 999</span></div></div></body></html>
