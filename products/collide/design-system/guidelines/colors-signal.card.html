<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;box-sizing:border-box;min-height:100vh;background:var(--bg-canvas)}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.glass{background:linear-gradient(var(--glass-fill-strong),var(--glass-fill-strong)) padding-box,var(--glass-border) border-box;border:1px solid transparent;box-shadow:var(--shadow-2)}
</style></head><body><div style="display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;gap:8px;align-items:end">
 <div><div style="height:96px;border-radius:var(--radius-md);background:var(--signal-500);box-shadow:var(--glow-signal);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box"><span class="mono" style="color:#fff">--signal-500 · #FF3D1F</span></div></div>
 <div style="flex:1;min-width:0"><div style="height:56px;border-radius:var(--radius-sm);background:var(--signal-300);box-shadow:inset 0 0 0 1px var(--line-1)"></div><div class="mono" style="margin-top:8px;color:var(--text-2)">300</div><div class="mono">#FF9C88</div></div><div style="flex:1;min-width:0"><div style="height:56px;border-radius:var(--radius-sm);background:var(--signal-400);box-shadow:inset 0 0 0 1px var(--line-1)"></div><div class="mono" style="margin-top:8px;color:var(--text-2)">400</div><div class="mono">#FF6A4F</div></div><div style="flex:1;min-width:0"><div style="height:56px;border-radius:var(--radius-sm);background:var(--signal-600);box-shadow:inset 0 0 0 1px var(--line-1)"></div><div class="mono" style="margin-top:8px;color:var(--text-2)">600</div><div class="mono">#D92E14</div></div><div style="flex:1;min-width:0"><div style="height:56px;border-radius:var(--radius-sm);background:var(--signal-700);box-shadow:inset 0 0 0 1px var(--line-1)"></div><div class="mono" style="margin-top:8px;color:var(--text-2)">700</div><div class="mono">#A82410</div></div></div></body></html>
