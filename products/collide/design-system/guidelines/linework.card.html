<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;box-sizing:border-box;min-height:100vh;background:var(--bg-canvas)}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.glass{background:linear-gradient(var(--glass-fill-strong),var(--glass-fill-strong)) padding-box,var(--glass-border) border-box;border:1px solid transparent;box-shadow:var(--shadow-2)}
</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:130px;border-radius:var(--radius-md);background:var(--pattern-dots),var(--surface-1);box-shadow:inset 0 0 0 1px var(--line-2)"></div><span class="mono">pattern-dots</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:130px;border-radius:var(--radius-md);background:var(--pattern-hatch),var(--surface-1);box-shadow:inset 0 0 0 1px var(--line-2)"></div><span class="mono">pattern-hatch</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:130px;border-radius:var(--radius-md);background:var(--pattern-bars),var(--surface-1);box-shadow:inset 0 0 0 1px var(--line-2)"></div><span class="mono">pattern-bars</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:130px;border-radius:var(--radius-md);background:var(--pattern-ticks),var(--surface-1);box-shadow:inset 0 0 0 1px var(--line-2);background-size:auto;background-repeat:repeat-x;background-position:0 bottom"></div><span class="mono">pattern-ticks</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:130px;border-radius:var(--radius-md);background:var(--pattern-grid),var(--surface-1);box-shadow:inset 0 0 0 1px var(--line-2)"></div><span class="mono">pattern-grid</span></div></div></body></html>
