<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;box-sizing:border-box;min-height:100vh;background:var(--bg-canvas)}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.glass{background:linear-gradient(var(--glass-fill-strong),var(--glass-fill-strong)) padding-box,var(--glass-border) border-box;border:1px solid transparent;box-shadow:var(--shadow-2)}
body{background:var(--surface-1)}</style></head><body><div class="row" style="gap:18px;padding-top:6px"><div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:100%;height:88px;border-radius:var(--radius-lg);background:var(--surface-2);box-shadow:var(--shadow-0)"></div><span class="mono">shadow-0</span></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:100%;height:88px;border-radius:var(--radius-lg);background:var(--surface-2);box-shadow:var(--shadow-1)"></div><span class="mono">shadow-1</span></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:100%;height:88px;border-radius:var(--radius-lg);background:var(--surface-2);box-shadow:var(--shadow-2)"></div><span class="mono">shadow-2</span></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:100%;height:88px;border-radius:var(--radius-lg);background:var(--surface-2);box-shadow:var(--shadow-3)"></div><span class="mono">shadow-3</span></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:100%;height:88px;border-radius:var(--radius-lg);background:var(--surface-2);box-shadow:var(--shadow-inset)"></div><span class="mono">shadow-inset</span></div></div></body></html>
