<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;box-sizing:border-box;min-height:100vh;background:var(--bg-canvas)}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.glass{background:linear-gradient(var(--glass-fill-strong),var(--glass-fill-strong)) padding-box,var(--glass-border) border-box;border:1px solid transparent;box-shadow:var(--shadow-2)}
</style></head><body><div style="background:var(--bg-canvas);padding:14px;border-radius:var(--radius-lg);box-shadow:inset 0 0 0 1px var(--line-1)"><span class="mono">bg-canvas</span>
 <div style="margin-top:8px;background:var(--bg-app);padding:12px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line-1)"><span class="mono">bg-app</span>
 <div style="margin-top:8px;display:flex;gap:8px"><div style="flex:1;height:54px;background:var(--surface-1);border-radius:var(--radius-sm);box-shadow:var(--shadow-1);padding:8px;box-sizing:border-box"><span class="mono">surface-1</span></div><div style="flex:1;height:54px;background:var(--surface-2);border-radius:var(--radius-sm);box-shadow:var(--shadow-1);padding:8px;box-sizing:border-box"><span class="mono">surface-2</span></div><div style="flex:1;height:54px;background:var(--surface-3);border-radius:var(--radius-sm);box-shadow:var(--shadow-1);padding:8px;box-sizing:border-box"><span class="mono">surface-3</span></div><div style="flex:1;height:54px;background:var(--surface-raised);border-radius:var(--radius-sm);box-shadow:var(--shadow-1);padding:8px;box-sizing:border-box"><span class="mono">surface-raised</span></div></div></div></div></body></html>
