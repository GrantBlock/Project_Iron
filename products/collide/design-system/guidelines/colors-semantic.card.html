<!-- @dsCard group="Colors" viewport="700x130" name="Intent" subtitle="Status colors with 16% soft fills" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;box-sizing:border-box;min-height:100vh;background:var(--bg-canvas)}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-3);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.glass{background:linear-gradient(var(--glass-fill-strong),var(--glass-fill-strong)) padding-box,var(--glass-border) border-box;border:1px solid transparent;box-shadow:var(--shadow-2)}
</style></head><body><div class="row" style="gap:10px"><div style="flex:1;border-radius:var(--radius-md);background:var(--accent-soft);padding:12px;display:flex;flex-direction:column;gap:18px"><span style="width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)"></span><span class="mono" style="color:var(--text-1)">accent</span></div><div style="flex:1;border-radius:var(--radius-md);background:var(--info-soft);padding:12px;display:flex;flex-direction:column;gap:18px"><span style="width:10px;height:10px;border-radius:50%;background:var(--info);box-shadow:0 0 12px var(--info)"></span><span class="mono" style="color:var(--text-1)">info</span></div><div style="flex:1;border-radius:var(--radius-md);background:var(--success-soft);padding:12px;display:flex;flex-direction:column;gap:18px"><span style="width:10px;height:10px;border-radius:50%;background:var(--success);box-shadow:0 0 12px var(--success)"></span><span class="mono" style="color:var(--text-1)">success</span></div><div style="flex:1;border-radius:var(--radius-md);background:var(--warning-soft);padding:12px;display:flex;flex-direction:column;gap:18px"><span style="width:10px;height:10px;border-radius:50%;background:var(--warning);box-shadow:0 0 12px var(--warning)"></span><span class="mono" style="color:var(--text-1)">warning</span></div><div style="flex:1;border-radius:var(--radius-md);background:var(--danger-soft);padding:12px;display:flex;flex-direction:column;gap:18px"><span style="width:10px;height:10px;border-radius:50%;background:var(--danger);box-shadow:0 0 12px var(--danger)"></span><span class="mono" style="color:var(--text-1)">danger</span></div></div></body></html>
